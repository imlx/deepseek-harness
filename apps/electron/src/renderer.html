<!doctype html>
<!--
  Minimal Electron IPC-transport validation page.
  Drives window.dshIpc directly (no module graph): create a session, open the mux
  downlink, send one prompt, and render the streamed assistant reply. This proves
  the two IPC paths ElectronApiClient rides — unary (dsh:fetch) and the downlink
  push (dsh:openStream) — before the full UI is wired up. Validation scaffolding,
  not product UI.
-->
<html>
<head><meta charset="utf-8"><title>dsh electron IPC check</title></head>
<body>
  <h1>dsh Electron IPC validation</h1>
  <pre id="log">booting…</pre>
  <script>
    const log = (line) => { document.getElementById('log').textContent += '\n' + line; console.log('[dsh-ipc-check]', line) }
    const ipc = globalThis.dshIpc
    const rpc = async (method, payload) => {
      const rpcId = crypto.randomUUID()
      const envelope = { type: 'client-request', rpcId, method, payload }
      const { status, body } = await ipc.fetch(`/api/${method}`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(envelope),
      })
      if (status < 200 || status >= 300) throw new Error(`${method}: HTTP ${status} ${body}`)
      const full = JSON.parse(body)
      if (!full.result.ok) throw new Error(`${method}: ${JSON.stringify(full.result)}`)
      return full.result.value
    }

    const run = async () => {
      if (ipc === undefined) { log('FAIL: window.dshIpc missing (preload did not run)'); return }
      log('dshIpc present')

      const { sessionId } = await rpc('session.create', {})
      log(`session.create -> ${sessionId}`)

      // Subscribe the mux downlink before prompting so no frame is missed.
      const streamId = await ipc.openStream('/api/events.mux')
      let replied = ''
      ipc.onStream(streamId, (data) => {
        if (data === null) { log('mux stream ended'); return }
        const frame = JSON.parse(data)
        const f = frame.payload
        if (f && f.type === 'session/event' && f.sessionId === sessionId && f.event) {
          console.log('[dsh-ipc-check] event:', f.event.type, JSON.stringify(f.event.data).slice(0, 300))
        }
        // Session content arrives as session/event passthrough; an assistant/chunk
        // event's data.chunk carries the streamed deltas (text-delta.text).
        if (f && f.type === 'session/event' && f.sessionId === sessionId && f.event && f.event.type === 'assistant/chunk') {
          const chunk = f.event.data && f.event.data.chunk
          if (chunk && chunk.type === 'text-delta' && typeof chunk.text === 'string') {
            replied += chunk.text
            document.getElementById('log').textContent = document.getElementById('log').textContent.replace(/\nreply:.*$/s, '') + '\nreply: ' + replied
            console.log('[dsh-ipc-check] reply:', replied)
          }
        }
        if (f && f.type === 'session/event' && f.sessionId === sessionId && f.event && f.event.type === 'assistant/message') {
          log('assistant/message received (turn complete)')
        }
      })
      log(`mux downlink open (${streamId})`)

      await rpc('session.prompt', { sessionId, mode: 'queue', content: [{ type: 'text', text: 'Reply with exactly: OK' }] })
      log('session.prompt accepted; waiting for stream…')
    }

    run().catch((error) => { log('FAIL: ' + (error && error.message ? error.message : String(error))) })
  </script>
</body>
</html>
